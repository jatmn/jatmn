<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">JATMN — Build. Review. Repeat.</title>
  <desc id="desc">A sky-blue header with dark-blue lettering and soft-orange geometric paths. Build. Review. Repeat. I ask, Why?</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="960" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#91D0F7"/>
      <stop offset="1" stop-color="#C7E8FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="48" y1="0" x2="912" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#246493"/>
      <stop offset="1" stop-color="#FFC18F"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#245B83" stroke-opacity="0.06"/>
    </pattern>
    <clipPath id="frame"><rect width="960" height="280" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="960" height="280" fill="url(#background)"/>
    <rect width="960" height="280" fill="url(#grid)"/>
    <path d="M48 1H912" stroke="url(#accent)" stroke-width="2"/>
    <g stroke-width="2">
      <path d="M724 0V56L780 112V168L892 280" stroke="#D98643" stroke-opacity="0.65"/>
      <path d="M960 56H868L812 112V208L740 280" stroke="#246493" stroke-opacity="0.45"/>
      <path d="M960 208H900L868 176V112L924 56V0" stroke="#D98643" stroke-opacity="0.45"/>
      <rect x="736" y="92" width="88" height="88" rx="18" fill="#E9F6FF" stroke="#246493" stroke-opacity="0.6"/>
      <path d="M768 120L752 136L768 152M792 120L808 136L792 152" stroke="#246493" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="812" cy="208" r="5" fill="#246493" stroke="#E9F6FF"/>
      <circle cx="868" cy="56" r="5" fill="#FFC18F" stroke="#E9F6FF"/>
    </g>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="48" y="53" fill="#246493" font-size="13" font-weight="600" letter-spacing="3">OPEN SOURCE / SOCAL</text>
      <text x="44" y="139" fill="#153F66" font-size="76" font-weight="750" letter-spacing="-3">JATMN<tspan fill="#FFC18F">.</tspan></text>
      <text x="48" y="186" fill="#234F74" font-size="27" font-weight="500">Build. Review. Repeat.</text>
      <text x="48" y="234" fill="#365F7D" font-size="19" font-style="italic">I ask, Why?</text>
    </g>
  </g>
</svg>
